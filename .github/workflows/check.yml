name: Template checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Verify the release pin when present
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { readPinnedImage } from './.railway/image.ts';
          const pin = JSON.parse(readFileSync('image.lock.json', 'utf8'));
          if (pin.status === 'awaiting_first_verified_release') {
            console.log('Deployment blocked: first verified main image has not been pinned.');
          } else {
            readPinnedImage();
          }
          NODE
